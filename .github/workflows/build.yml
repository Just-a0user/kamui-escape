name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -scheme "$(xcodebuild -list 2>/dev/null | grep -A2 'Schemes:' | tail -1 | xargs)" \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -r $RUNNER_TEMP/app.xcarchive/Products/Applications/*.app \
            $RUNNER_TEMP/ipa/Payload/
          cd $RUNNER_TEMP/ipa
          zip -r kamui-escape-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kamui-escape-unsigned
          path: ${{ runner.temp }}/ipa/kamui-escape-unsigned.ipa
          retention-days: 7
